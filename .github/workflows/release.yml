name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/platforms" 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No signing key configured; release will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Signing key restored (stable signature, upgrades install over old builds)."

      - name: Build release APK
        env:
          DEFAULT_STUDIO_URL: ${{ vars.DEFAULT_STUDIO_URL }}
          APP_VERSION_TAG: ${{ github.ref_name }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/ekko-studio-android.apk
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ekko-studio-android-release
          path: out/ekko-studio-android.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/ekko-studio-android.apk
          generate_release_notes: true
          body: |
            Android client for self-hosted Ekko Studio.

            - Baseline: mrz2333/hermes-studio-mobile v1.9.7 (MIT)
            - Signed with the debug key unless repository signing secrets are configured,
              so Android may warn about an unknown developer — choose "Install anyway".
            - First launch: enter your Ekko Studio URL (e.g. http://192.168.1.10:8648)
              plus your studio username and password.
